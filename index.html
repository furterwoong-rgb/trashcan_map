    /* Marker Pulse Animation */
    .pulse-dot-container {
      position: relative;
      width: 28px;
      height: 28px;
    }
    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: rgba(49, 130, 246, 0.4);
      animation: pulseAnimation 2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }
    .pulse-core {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #3182F6;
      border: 2.5px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    @keyframes pulseAnimation {
      0% {
        transform: scale(0.6);
        opacity: 0.9;
      }
      80% {
        transform: scale(2.6);
        opacity: 0;
      }
      100% {
        transform: scale(2.8);
        opacity: 0;
      }
    }

    /* Trash Marker Pin Animation */
    .trash-pin {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);

    .trash-pin:hover, .trash-pin.active {

    }

    /* Polyline Animated Dash */
    .guide-polyline {
      stroke-dasharray: 8, 8;

    }
    @keyframes dashMove {
      to {
        stroke-dashoffset: -16;
      }
    }

    // ==========================================
    // 3. 거리 계산 (Haversine Formula) & 도보 시간
    // ==========================================
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // meters
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

      return Math.round(R * c); // Distance in meters
    }

    function formatDistance(meters) {
      if (meters < 1000) {
        return `${meters}m`;
      }
      return `${(meters / 1000).toFixed(1)}km`;
    }

    function calculateWalkTime(meters) {
      // 평균 도보 속도: 시속 4km = 분당 약 67m
      const minutes = Math.max(1, Math.round(meters / 67));
      return `도보 ${minutes}분`;
    }

    // ==========================================

        zoom: 17,
        zoomControl: false,
        attributionControl: true
      });

      // Toss / Karrot 스타일의 초미니멀 밝은 타일맵 (CartoDB Positron)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        subdomains: 'abcd',
        maxZoom: 20,
        attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; OpenStreetMap'
      }).addTo(map);

      markerLayerGroup = L.layerGroup().addTo(map);

      // 내 위치 펄스 마커 렌더링
      renderUserMarker();

      // 쓰레기통 마커 및 초기 최근접 계산
      updateTrashMarkers();
    }

    // ==========================================
    // 5. 내 위치 펄스 마커
    // ==========================================
    function renderUserMarker() {
      const pulseIcon = L.divIcon({
        className: 'custom-pulse-marker',
        html: `
          <div class="pulse-dot-container">
            <div class="pulse-ring"></div>
            <div class="pulse-core"></div>
          </div>
        `,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });

      if (userMarker) {
        userMarker.setLatLng([userPos.lat, userPos.lng]);
      } else {
        userMarker = L.marker([userPos.lat, userPos.lng], {
          icon: pulseIcon,
          zIndexOffset: 1000
        }).addTo(map);
      }
    }

    // ==========================================
    // 6. 쓰레기통 커스텀 마커 생성
    // ==========================================
    function getMarkerIcon(type, isClosest = false) {
      let bgColor = "#3182F6"; // Toss Blue for recycle/both
      let iconSvg = "";

      if (type === 'cigarette') {
        bgColor = "#F97316"; // Orange
        // Cigarette SVG
        iconSvg = `
          <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 12H2v4h16"/>
            <path d="M22 12v4"/>
            <path d="M7 12v4"/>
            <path d="M18 8c0-2.5-2-2.5-2-5"/>
            <path d="M22 8c0-2.5-2-2.5-2-5"/>
          </svg>
        `;
      } else if (type === 'recycle') {
        bgColor = "#3182F6"; // Blue
        // Recycle Trash Icon
        iconSvg = `
          <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"/>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
            <line x1="10" y1="11" x2="10" y2="17"/>
            <line x1="14" y1="11" x2="14" y2="17"/>
          </svg>
        `;
      } else {
        // Both (일반 + 꽁초) - Emerald Teal
        bgColor = "#10B981";
        iconSvg = `
          <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            <path d="M10 11v6M14 11v6"/>
          </svg>
        `;
      }

      const ringClass = isClosest ? "ring-4 ring-brand-500/40 animate-bounce" : "";

      return L.divIcon({
        className: 'custom-trash-icon',
        html: `
          <div class="trash-pin relative flex flex-col items-center cursor-pointer">
            <div class="w-8 h-8 rounded-full shadow-lg flex items-center justify-center ${ringClass}" style="background-color: ${bgColor};">
              ${iconSvg}
            </div>
            <div class="w-2 h-2 rotate-45 -mt-1 shadow-sm" style="background-color: ${bgColor};"></div>
          </div>
        `,
        iconSize: [32, 36],
        iconAnchor: [16, 34]
      });
    }

    // ==========================================
    // 7. 쓰레기통 마커 갱신 및 최근접 탐색
    // ==========================================
    function updateTrashMarkers() {
      markerLayerGroup.clearLayers();

      // 필터링 적용
      const filtered = MOCK_TRASH_DATA.filter(item => {
        if (currentFilter === 'all') return true;
        if (currentFilter === 'recycle') return item.type === 'recycle' || item.type === 'both';
        if (currentFilter === 'cigarette') return item.type === 'cigarette' || item.type === 'both';
        return true;
      });

      // 각 항목과 현재 위치 간의 거리 계산
      const itemsWithDistance = filtered.map(item => ({
        ...item,
        distance: calculateDistance(userPos.lat, userPos.lng, item.lat, item.lng)
      })).sort((a, b) => a.distance - b.distance);

      // 뱃지 개수 업데이트
      updateBadges();

      if (itemsWithDistance.length === 0) return;

      // 가장 가까운 쓰레기통
      closestTrash = itemsWithDistance[0];

      // 현재 선택된 쓰레기통이 없거나 필터에서 빠졌으면 가장 가까운 것으로 설정
      if (!selectedTrash || !filtered.some(f => f.id === selectedTrash.id)) {
        selectedTrash = closestTrash;
      } else {
        // 거리 갱신
        selectedTrash = itemsWithDistance.find(it => it.id === selectedTrash.id) || closestTrash;
      }

      // 마커 생성 및 지도에 추가
      itemsWithDistance.forEach(item => {
        const isClosest = (item.id === closestTrash.id);
        const marker = L.marker([item.lat, item.lng], {
          icon: getMarkerIcon(item.type, isClosest)
        });

        marker.on('click', () => {
          selectTrashItem(item);
        });

        markerLayerGroup.addLayer(marker);
      });

      // 바텀 시트 업데이트 & 점선 그리기
      updateBottomSheet(selectedTrash);
      drawGuidePolyline(selectedTrash);
    }

    // ==========================================
    // 8. 내 위치 ~ 목적지 점선(Polyline) 그리기
    // ==========================================
    function drawGuidePolyline(targetItem) {
      if (!targetItem) return;

      if (guidePolyline) {
        map.removeLayer(guidePolyline);
      }

      const latlngs = [
        [userPos.lat, userPos.lng],
        [targetItem.lat, targetItem.lng]
      ];

      guidePolyline = L.polyline(latlngs, {
        color: '#3182F6',
        weight: 4,
        opacity: 0.85,
        lineCap: 'round',
        className: 'guide-polyline'
      }).addTo(map);
    }

    // ==========================================
    // 9. 특정 쓰레기통 선택 시 UI 및 지도 이동
    // ==========================================
    function selectTrashItem(item) {
      selectedTrash = item;
      updateBottomSheet(item);
      drawGuidePolyline(item);

      // 지도 부드럽게 이동 (바텀시트 높이를 감안하여 살짝 아래 오프셋)
      map.flyTo([item.lat, item.lng], 18, {
        duration: 0.8,
        easeLinearity: 0.25
      });
    }

    // ==========================================
    // 10. 바텀 시트 UI 업데이트
    // ==========================================
    function updateBottomSheet(item) {
      if (!item) return;

      const isClosest = closestTrash && (item.id === closestTrash.id);
      const sheetBadge = document.getElementById('sheet-badge');
      const sheetCategory = document.getElementById('sheet-category');
      const sheetTitle = document.getElementById('sheet-title');
      const sheetDesc = document.getElementById('sheet-desc');
      const sheetDistance = document.getElementById('sheet-distance');
      const sheetWalkTime = document.getElementById('sheet-walk-time');

      if (isClosest) {
        sheetBadge.textContent = "📍 가장 가까운 곳";
        sheetBadge.className = "px-2 py-0.5 rounded-md text-[11px] font-bold bg-brand-50 text-brand-600";
      } else {
        sheetBadge.textContent = "선택된 위치";
        sheetBadge.className = "px-2 py-0.5 rounded-md text-[11px] font-bold bg-gray-100 text-gray-700";
      }

      // 카테고리 텍스트
      if (item.type === 'recycle') {
        sheetCategory.textContent = "일반 · 재활용";
      } else if (item.type === 'cigarette') {
        sheetCategory.textContent = "담배꽁초 수거함";
      } else {
        sheetCategory.textContent = "일반 + 꽁초 수거함";
      }

      sheetTitle.textContent = item.name;
      sheetDesc.textContent = item.desc || "상세 설명이 없는 장소입니다.";

      const dist = item.distance !== undefined ? item.distance : calculateDistance(userPos.lat, userPos.lng, item.lat, item.lng);
      sheetDistance.textContent = formatDistance(dist);
      sheetWalkTime.textContent = calculateWalkTime(dist);

      // 외부 길찾기 링크 세팅
      setupNavigationLinks(item);
    }

    // ==========================================
    // 11. 길찾기 URL 세팅 (카카오맵, 네이버, 구글)
    // ==========================================
    function setupNavigationLinks(item) {
      // 카카오맵 도보 길찾기
      const kakaoUrl = `https://map.kakao.com/link/to/${encodeURIComponent(item.name)},${item.lat},${item.lng}`;
      document.getElementById('link-kakaomap').href = kakaoUrl;

      // 네이버 지도 길찾기
      const naverUrl = `https://map.naver.com/v5/directions/-/${item.lng},${item.lat},${encodeURIComponent(item.name)}/-/walk`;
      document.getElementById('link-navermap').href = naverUrl;

      // 구글 지도 길찾기
      const googleUrl = `https://www.google.com/maps/dir/?api=1&origin=${userPos.lat},${userPos.lng}&destination=${item.lat},${item.lng}&travelmode=walking`;
      document.getElementById('link-googlemap').href = googleUrl;
    }

    // ==========================================
    // 12. 필터 버튼 뱃지 카운트
    // ==========================================
    function updateBadges() {
      const allCount = MOCK_TRASH_DATA.length;
      const recycleCount = MOCK_TRASH_DATA.filter(i => i.type === 'recycle' || i.type === 'both').length;
      const cigCount = MOCK_TRASH_DATA.filter(i => i.type === 'cigarette' || i.type === 'both').length;

      document.getElementById('badge-all').textContent = allCount;
      document.getElementById('badge-recycle').textContent = recycleCount;
      document.getElementById('badge-cigarette').textContent = cigCount;
    }

    // ==========================================
    // 13. 위치 권한 및 GPS 추적
    // ==========================================
    function requestLocation() {
      const statusEl = document.getElementById('sub-status');
      statusEl.textContent = "정밀 GPS 위치 측정 중...";

      if (!navigator.geolocation) {
        fallbackLocation("GPS를 지원하지 않는 브라우저입니다.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          userPos = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };
          statusEl.textContent = "📍 현재 위치 기준 실시간 탐색됨";
          renderUserMarker();
          updateTrashMarkers();
          map.panTo([userPos.lat, userPos.lng]);
        },
        (error) => {
          let reason = "위치 권한 미허용";
          if (error.code === error.PERMISSION_DENIED) reason = "위치 권한이 거부됨";
          else if (error.code === error.TIMEOUT) reason = "위치 응답 시간 초과";
          fallbackLocation(reason);
        },
        {
          enableHighAccuracy: true,
          timeout: 8000,
          maximumAge: 5000
        }
      );
    }

    function fallbackLocation(reason) {
      const statusEl = document.getElementById('sub-status');
      statusEl.textContent = `📍 ${reason} (강남역 11번 출구 기본값)`;
      userPos = { lat: DEFAULT_LOCATION.lat, lng: DEFAULT_LOCATION.lng };
      renderUserMarker();
      updateTrashMarkers();
    }

    // ==========================================
    // 14. 이벤트 리스너 등록
    // ==========================================
    function setupEventListeners() {
      // 필터 칩 클릭 이벤트
      document.querySelectorAll('.filter-chip').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const filter = btn.getAttribute('data-filter');
          currentFilter = filter;

          // UI 스타일 토글
          document.querySelectorAll('.filter-chip').forEach(b => {
            b.classList.remove('bg-gray-900', 'text-white');
            b.classList.add('bg-white/90', 'text-gray-700');
          });
          btn.classList.remove('bg-white/90', 'text-gray-700');
          btn.classList.add('bg-gray-900', 'text-white');

          // 마커 및 바텀시트 다시 계산
          selectedTrash = null;
          updateTrashMarkers();

          // 최근접 쓰레기통과 내 위치가 한 화면에 보이도록 조정
          if (closestTrash) {
            const bounds = L.latLngBounds([
              [userPos.lat, userPos.lng],
              [closestTrash.lat, closestTrash.lng]
            ]);
            map.fitBounds(bounds, { padding: [100, 50], maxZoom: 18 });
          }
        });
      });

      // 내 위치 재탐색 버튼
      document.getElementById('btn-refresh').addEventListener('click', () => {
        requestLocation();
      });

      // 내 위치 센터링 버튼 (FAB)
      document.getElementById('btn-recenter').addEventListener('click', () => {
        map.flyTo([userPos.lat, userPos.lng], 17, { duration: 0.6 });
      });

      // 경로 점선 표시 및 화면 포커싱
      document.getElementById('btn-show-line').addEventListener('click', () => {
        if (!selectedTrash) return;
        drawGuidePolyline(selectedTrash);
        const bounds = L.latLngBounds([
          [userPos.lat, userPos.lng],
          [selectedTrash.lat, selectedTrash.lng]
        ]);
        map.fitBounds(bounds, { padding: [120, 60], maxZoom: 18 });
      });

      // 길찾기 모달 열기/닫기
      const navModal = document.getElementById('nav-modal');
      document.getElementById('btn-navigate').addEventListener('click', () => {
        navModal.classList.remove('hidden');
        navModal.classList.add('flex');
      });

      document.getElementById('btn-close-modal').addEventListener('click', () => {
        navModal.classList.add('hidden');
        navModal.classList.remove('flex');
      });

      navModal.addEventListener('click', (e) => {
        if (e.target === navModal) {
          navModal.classList.add('hidden');
          navModal.classList.remove('flex');
        }
      });
    }

    // ==========================================
    // 15. 앱 구동
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      setupEventListeners();
      requestLocation();
    });
  </script>
</body>
</html>
